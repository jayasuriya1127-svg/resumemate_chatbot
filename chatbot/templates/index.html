<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ResumeMate — Resume &amp; CV Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --page-bg: #e7e9e4;
    --paper: #fdfdfb;
    --hairline: #dedad0;
    --ink: #20291f;
    --ink-soft: #63705f;
    --accent: #2f6f5e;
    --accent-deep: #1f4f42;
    --accent-tint: #e4efe9;
    --user-bg: #20291f;
    --user-fg: #f4f2ea;
    --error: #a13f34;
    --radius: 4px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--page-bg);
    font-family: "Work Sans", sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .sheet {
    width: 100%;
    max-width: 660px;
    height: min(870px, 92vh);
    background: var(--paper);
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 0 rgba(32, 41, 31, 0.04), 0 20px 44px -26px rgba(32, 41, 31, 0.4);
    overflow: hidden;
  }

  header {
    padding: 28px 32px 22px;
    border-bottom: 2px solid var(--accent);
    position: relative;
  }

  .monogram {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Spectral", serif;
    font-weight: 600;
    font-size: 16px;
    float: right;
  }

  h1 {
    font-family: "Spectral", serif;
    font-weight: 700;
    font-size: 27px;
    margin: 0 0 4px;
    color: var(--ink);
  }

  header .role-line {
    margin: 0;
    font-size: 13px;
    color: var(--accent-deep);
    font-weight: 500;
  }

  header p.desc {
    margin: 10px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.55;
    max-width: 480px;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 32px;
  }

  .section-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 18px;
  }

  .section-divider span {
    font-size: 11.5px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .section-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  .msg {
    max-width: 90%;
    margin-bottom: 16px;
    line-height: 1.6;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .msg.bot {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .msg.bot .marker {
    width: 7px;
    height: 7px;
    margin-top: 8px;
    background: var(--accent);
    flex-shrink: 0;
  }

  .msg.bot .bubble {
    color: var(--ink);
  }

  .msg.user {
    margin-left: auto;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    color: var(--user-fg);
    padding: 10px 14px;
    border-radius: var(--radius);
  }

  .msg.error {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .msg.error .marker {
    width: 7px;
    height: 7px;
    margin-top: 8px;
    background: var(--error);
    flex-shrink: 0;
  }

  .msg.error .bubble {
    color: var(--error);
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding-top: 8px;
  }

  .typing span {
    width: 5px;
    height: 5px;
    background: var(--accent-deep);
    border-radius: 50%;
    animation: blink 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) {
    animation-delay: 0.15s;
  }
  .typing span:nth-child(3) {
    animation-delay: 0.3s;
  }

  @keyframes blink {
    0%, 80%, 100% {
      opacity: 0.25;
    }
    40% {
      opacity: 1;
    }
  }

  form {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    padding: 16px 32px 22px;
    border-top: 1px solid var(--hairline);
    background: var(--paper);
  }

  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-size: 11px;
    color: var(--ink-soft);
  }

  textarea {
    resize: none;
    border: none;
    border-bottom: 1px solid var(--hairline);
    background: transparent;
    font-family: "Work Sans", sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    padding: 4px 2px 8px;
    max-height: 120px;
    line-height: 1.5;
  }

  textarea:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }

  textarea::placeholder {
    color: var(--ink-soft);
    opacity: 0.7;
  }

  button {
    font-family: "Work Sans", sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: var(--accent);
    color: var(--paper);
    border: none;
    padding: 11px 20px;
    cursor: pointer;
    border-radius: var(--radius);
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:hover:not(:disabled) {
    background: var(--accent-deep);
  }

  button:active:not(:disabled) {
    transform: scale(0.97);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .chat::-webkit-scrollbar {
    width: 8px;
  }
  .chat::-webkit-scrollbar-thumb {
    background: var(--hairline);
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg, .typing span {
      animation: none;
    }
  }

  @media (max-width: 480px) {
    header, .chat, form {
      padding-left: 20px;
      padding-right: 20px;
    }
  }
</style>
</head>
<body>
  <div class="sheet">
    <header>
      <div class="monogram">RM</div>
      <h1>ResumeMate</h1>
      <p class="role-line">Resume &amp; CV Assistant</p>
      <p class="desc">Paste your resume text, ask for a rewrite, or get help tailoring your experience to a role you're applying for.</p>
    </header>

    <div class="chat" id="chat" aria-live="polite">
      <div class="section-divider"><span>Conversation</span></div>
    </div>

    <form id="chat-form">
      <div class="field">
        <label for="input">Your message</label>
        <textarea
          id="input"
          rows="1"
          placeholder="e.g. Review this bullet point, or help me tailor my resume for a marketing role..."
          autofocus
        ></textarea>
      </div>
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");

    // Client-side history kept in memory only (role + text)
    const history = [];

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = "msg " + role;

      if (role === "user") {
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrapper.appendChild(bubble);
      } else {
        const marker = document.createElement("div");
        marker.className = "marker";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrapper.appendChild(marker);
        wrapper.appendChild(bubble);
      }

      chatEl.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function addTypingIndicator() {
      const wrapper = document.createElement("div");
      wrapper.className = "msg bot";
      wrapper.id = "typing-indicator";

      const marker = document.createElement("div");
      marker.className = "marker";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";

      wrapper.appendChild(marker);
      wrapper.appendChild(typing);
      chatEl.appendChild(wrapper);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    }

    inputEl.addEventListener("input", autoResize);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        formEl.requestSubmit();
      }
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = inputEl.value.trim();
      if (!message) return;

      addMessage("user", message);
      history.push({ role: "user", text: message });

      inputEl.value = "";
      autoResize();
      inputEl.disabled = true;
      sendBtn.disabled = true;
      addTypingIndicator();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history: history.slice(0, -1), // prior turns, excluding the one just sent
          }),
        });

        const data = await res.json();
        removeTypingIndicator();

        if (!res.ok) {
          addMessage("error", data.error || "Something went wrong. Please try again.");
        } else {
          addMessage("bot", data.reply);
          history.push({ role: "bot", text: data.reply });
        }
      } catch (err) {
        removeTypingIndicator();
        addMessage("error", "Could not reach the server. Please check your connection.");
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    // Greet the user on load
    addMessage(
      "bot",
      "Hi, I'm ResumeMate. Paste a resume section, ask for feedback, or tell me the role you're targeting and I'll help you tailor it."
    );
  </script>
</body>
</html>
